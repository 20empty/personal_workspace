name: Release Desktop Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload binaries to
        required: true
        default: v0.0.1

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: windows-x86

    runs-on: ${{ matrix.os }}
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Validate macOS signing prerequisites
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Validate Windows signing prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "Missing required secret: WINDOWS_CERTIFICATE"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing required secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

      - name: Build Tauri bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (-not (Test-Path $bundleDir)) {
            $bundleDir = "src-tauri/target/release/bundle"
          }
          if (-not (Test-Path $bundleDir)) {
            throw "Bundle directory not found for target ${{ matrix.target }}"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $signtoolPath = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          if (-not (Test-Path $signtoolPath)) {
            throw "signtool.exe not found at expected path: $signtoolPath"
          }

          $files = Get-ChildItem -Path $bundleDir -Recurse -File -Include *.msi,*.exe
          if ($files.Count -eq 0) {
            throw "No Windows installer files found to sign under $bundleDir"
          }

          foreach ($file in $files) {
            & "$signtoolPath" sign /fd SHA256 /f "$pfxPath" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr "$timestampUrl" /td SHA256 "$($file.FullName)"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign $($file.FullName)"
            }
          }

      - name: Pack bundle directory
        shell: bash
        run: |
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          elif [ -d "src-tauri/target/release/bundle" ]; then
            BUNDLE_DIR="src-tauri/target/release/bundle"
          else
            echo "Bundle directory not found for target ${{ matrix.target }}"
            find src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi

          mkdir -p out
          cp -R "$BUNDLE_DIR" "out/bundle"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/bundle
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Automated desktop binary release"
          fi

      - name: Upload binary assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.zip" \))

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files found to upload"
            exit 1
          fi

          gh release upload "$TAG" "${files[@]}" --clobber
