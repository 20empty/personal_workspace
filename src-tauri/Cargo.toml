[package]
name = "classroom"
version = "1.3.0"
description = "Classroom desktop app"
authors = ["Jerry"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3.2", features = [] }

[dependencies]
tauri = { version = "2.3.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
